<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --red:#790D16; --blue:#AEC4D4; --cream:#F5EFE1; --ink:#2b1215; --muted:#7a5d60; --paper:#fffaf0; --line:#e3d9c4; --blue-soft:#d7e2ea; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 'Inter',system-ui,sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }
  h1,h2 { font-family:'Fraunces',Georgia,serif; margin:0; }
  .shell { max-width:1040px; margin:0 auto; min-height:100vh; display:grid; grid-template-columns:1fr 1.1fr; gap:32px; align-items:center; padding:32px 20px; }

  /* hero */
  .hero { position:relative; background:var(--red); color:var(--cream); border-radius:28px; padding:44px 36px; overflow:hidden; min-height:420px; display:flex; flex-direction:column; justify-content:flex-end; }
  .hero::before { content:''; position:absolute; width:300px; height:300px; border-radius:50%; background:var(--blue); top:-90px; right:-90px; }
  .hero::after { content:''; position:absolute; width:150px; height:150px; border-radius:50%; border:22px solid var(--cream); opacity:.18; top:150px; left:-50px; }
  .hero h1 { font-size:46px; font-weight:800; line-height:1.05; position:relative; }
  .hero p { margin:14px 0 0; opacity:.9; max-width:30ch; position:relative; }
  .badge { position:relative; display:inline-block; background:var(--blue); color:var(--red); font-weight:600; font-size:13px; padding:6px 12px; border-radius:99px; margin-bottom:16px; align-self:flex-start; }

  /* cards */
  .card { background:var(--paper); border:2px solid var(--red); border-radius:24px; padding:26px; box-shadow:8px 8px 0 var(--blue); }
  .tabs { display:flex; gap:6px; background:var(--cream); border:1px solid var(--line); border-radius:99px; padding:5px; margin-bottom:12px; }
  .tabs button { flex:1; border:0; background:none; padding:10px; border-radius:99px; font:inherit; font-weight:600; color:var(--red); cursor:pointer; }
  .tabs button.on { background:var(--red); color:var(--cream); }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  input, select { width:100%; padding:13px 14px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--red); }
  .dur { display:flex; gap:10px; }
  .dur input { flex:1.4; font-size:22px; font-weight:600; padding:14px 16px; }
  .dur select { flex:1; font-size:17px; }
  .hint { display:block; margin-top:6px; font-size:13px; color:var(--muted); }
  .btn { width:100%; margin-top:18px; padding:14px; border:0; border-radius:12px; background:var(--red); color:var(--cream); font:inherit; font-weight:600; font-size:17px; cursor:pointer; transition:transform .1s; }
  .btn:hover { transform:translateY(-2px); }
  .err { color:var(--red); font-weight:600; font-size:14px; min-height:20px; margin-top:10px; }
  .pass { display:flex; gap:10px; align-items:center; background:var(--blue-soft); border:2px dashed var(--red); border-radius:14px; padding:12px 14px; margin-top:16px; }
  .pass code { flex:1; font-size:26px; font-weight:700; letter-spacing:3px; color:var(--red); }
  .pass button { padding:8px 14px; border:2px solid var(--red); background:var(--cream); color:var(--red); font-weight:600; border-radius:10px; cursor:pointer; }
  .hide { display:none !important; }

  /* chat */
  #chat { display:flex; flex-direction:column; height:min(86vh,720px); padding:0; overflow:hidden; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--red); color:var(--cream); padding:16px 20px; }
  .head h1 { font-size:22px; }
  #timer { background:var(--blue); color:var(--red); font-weight:600; font-size:13px; padding:6px 12px; border-radius:99px; white-space:nowrap; }
  #timer:empty { display:none; }
  .admin { background:var(--blue-soft); border-bottom:2px solid var(--blue); padding:14px 20px; display:grid; gap:10px; font-size:14px; }
  .admin .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .admin code { font-weight:700; letter-spacing:2px; color:var(--red); font-size:16px; }
  .admin input[type=number] { width:110px; flex:none; font-size:20px; font-weight:600; padding:10px 12px; }
  .admin select { flex:1; min-width:120px; padding:11px 12px; }
  .admin button { padding:11px 16px; border:0; border-radius:10px; background:var(--red); color:var(--cream); font:inherit; font-weight:600; cursor:pointer; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:16px 20px; background:var(--cream); }
  .msg { max-width:80%; padding:9px 14px; border-radius:18px 18px 18px 4px; background:var(--paper); border:1px solid var(--line); align-self:flex-start; word-wrap:break-word; }
  .msg.me { background:var(--blue); border-color:var(--blue); border-radius:18px 18px 4px 18px; align-self:flex-end; }
  .msg b { display:block; font-size:12px; color:var(--red); }
  .sys { align-self:center; font-size:12px; color:var(--muted); background:var(--paper); padding:3px 10px; border-radius:99px; }
  #form { display:flex; gap:10px; padding:14px 20px; background:var(--paper); border-top:2px solid var(--line); }
  #form input { flex:1; }
  #form button { padding:0 22px; border:0; border-radius:12px; background:var(--red); color:var(--cream); font:inherit; font-weight:600; cursor:pointer; }

  @media (max-width:820px) {
    .shell { grid-template-columns:1fr; padding:16px 14px; gap:20px; }
    .hero { min-height:200px; padding:28px 24px; border-radius:22px; }
    .hero h1 { font-size:32px; }
    .hero::before { width:180px; height:180px; top:-60px; right:-60px; }
    .card { box-shadow:5px 5px 0 var(--blue); }
  }
</style>
</head>
<body>
<main class="shell">
  <aside class="hero">
    <span class="badge">Private &middot; Expiring &middot; Invite-only</span>
    <h1>Chat that vanishes on schedule.</h1>
    <p>Create a pass, share it with a friend, and talk in a room only you two can enter.</p>
  </aside>

  <section>
    <div class="card" id="home">
      <h2 style="font-size:26px;margin-bottom:14px">Pass Chat</h2>
      <div class="tabs">
        <button id="tabCreate" class="on">Create a pass</button>
        <button id="tabJoin">Join with a pass</button>
      </div>

      <div id="createPane">
        <label>Chat name</label>
        <input id="cName" maxlength="40" placeholder="e.g. Study group">
        <label>Your name</label>
        <input id="cUser" maxlength="24" placeholder="Admin">
        <label>Pass valid for</label>
        <div class="dur">
          <input id="cAmt" type="number" min="1" step="any" value="1">
          <select id="cUnit">
            <option value="minutes">minutes</option>
            <option value="hours">hours</option>
            <option value="days" selected>days</option>
          </select>
        </div>
        <span class="hint">Choose any time up to 7 days.</span>
        <label>Who can see the time left?</label>
        <select id="cVis">
          <option value="all">All members</option>
          <option value="admin">Only me (admin)</option>
        </select>
        <button class="btn" id="createBtn">Generate pass</button>
        <div id="created" class="hide">
          <div class="pass"><code id="newPass"></code><button id="copyBtn">Copy</button></div>
          <span class="hint">Send this pass to your friend. It expires <span id="newExp"></span>.</span>
          <button class="btn" id="enterBtn">Enter chat</button>
        </div>
      </div>

      <div id="joinPane" class="hide">
        <label>Pass</label>
        <input id="jPass" placeholder="XXXX-XXXX" style="text-transform:uppercase;font-size:20px;letter-spacing:2px">
        <label>Your name</label>
        <input id="jUser" maxlength="24" placeholder="Your name">
        <button class="btn" id="joinBtn">Join chat</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <div class="card hide" id="chat">
      <div class="head"><h1 id="roomName"></h1><span id="timer"></span></div>
      <div class="admin hide" id="adminPanel">
        <div class="row">Pass: <code id="adminPass"></code></div>
        <div class="row"><input id="aAmt" type="number" min="1" step="any" value="1"><select id="aUnit"><option value="minutes">minutes</option><option value="hours">hours</option><option value="days" selected>days</option></select><button id="aDurBtn">Set validity from now</button></div>
        <div class="row"><select id="aVis"><option value="all">Time left visible to all</option><option value="admin">Time left visible to me only</option></select><button id="aVisBtn">Apply</button></div>
      </div>
      <div id="log"></div>
      <form id="form"><input id="text" autocomplete="off" placeholder="Type a message" maxlength="1000"><button>Send</button></form>
    </div>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const socket = io();
let me = '', expiresAt = null, created = null, timerInt = null;

function show(pane) {
  $('createPane').classList.toggle('hide', pane !== 'create');
  $('joinPane').classList.toggle('hide', pane !== 'join');
  $('tabCreate').classList.toggle('on', pane === 'create');
  $('tabJoin').classList.toggle('on', pane === 'join');
  $('err').textContent = '';
}
$('tabCreate').onclick = () => show('create');
$('tabJoin').onclick = () => show('join');

function addMsg(m) {
  const d = document.createElement('div');
  d.className = 'msg' + (m.name === me ? ' me' : '');
  const b = document.createElement('b'); b.textContent = m.name;
  const t = document.createElement('span'); t.textContent = m.text;
  d.append(b, t);
  $('log').append(d);
  $('log').scrollTop = $('log').scrollHeight;
}
function addSys(text) {
  const d = document.createElement('div');
  d.className = 'sys'; d.textContent = text;
  $('log').append(d);
  $('log').scrollTop = $('log').scrollHeight;
}

function enter(pass, name, adminKey) {
  socket.emit('join', { pass, name, adminKey }, res => {
    if (!res.ok) { $('err').textContent = res.error; return; }
    me = name; expiresAt = res.expiresAt;
    $('home').classList.add('hide');
    $('chat').classList.remove('hide');
    $('roomName').textContent = res.roomName;
    $('log').innerHTML = '';
    res.history.forEach(addMsg);
    if (res.isAdmin) {
      $('adminPanel').classList.remove('hide');
      $('adminPass').textContent = res.pass;
      $('aVis').value = res.timerVisibility;
    }
    clearInterval(timerInt); tick(); timerInt = setInterval(tick, 1000);
    $('text').focus();
  });
}

function tick() {
  if (!expiresAt) { $('timer').textContent = ''; return; }
  const s = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  $('timer').textContent = 'Expires in ' + (d ? d + 'd ' : '') + h + 'h ' + m + 'm' + (d ? '' : ' ' + (s % 60) + 's');
}

$('createBtn').onclick = async () => {
  const user = $('cUser').value.trim();
  if (!user) { $('err').textContent = 'Enter your name.'; return; }
  const r = await fetch('/api/rooms', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: $('cName').value, duration: { amount: $('cAmt').value, unit: $('cUnit').value }, timerVisibility: $('cVis').value })
  });
  const data = await r.json();
  if (!r.ok) { $('err').textContent = data.error; return; }
  created = { ...data, user };
  $('newPass').textContent = data.pass;
  $('newExp').textContent = new Date(data.expiresAt).toLocaleString();
  $('created').classList.remove('hide');
  $('createBtn').classList.add('hide');
  $('err').textContent = '';
};
$('copyBtn').onclick = () => navigator.clipboard.writeText(created.pass).then(() => $('copyBtn').textContent = 'Copied');
$('enterBtn').onclick = () => enter(created.pass, created.user, created.adminKey);
$('joinBtn').onclick = () => enter($('jPass').value, $('jUser').value);

$('form').onsubmit = e => {
  e.preventDefault();
  const v = $('text').value.trim();
  if (v) socket.emit('message', v);
  $('text').value = '';
};
$('aDurBtn').onclick = () => socket.emit('setValidity', { amount: $('aAmt').value, unit: $('aUnit').value }, r => addSys(r && r.ok ? 'Validity updated' : 'Could not update: validity must be 1 minute to 7 days'));
$('aVisBtn').onclick = () => socket.emit('setTimerVisibility', $('aVis').value, r => addSys(r && r.ok ? 'Visibility updated' : 'Could not update'));
socket.on('state', st => { expiresAt = st.expiresAt; tick(); });
socket.on('message', addMsg);
socket.on('system', addSys);
socket.on('expired', () => {
  addSys('This pass has expired. The chat is closed.');
  $('form').classList.add('hide');
});
</script>
</body>
</html>
